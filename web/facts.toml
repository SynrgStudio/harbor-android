# ---------------------------------------------------------------- measured on the phone
# Release builds on the [phone] above, installed over wireless debugging. Startup: `am force-stop`, then
# `am start -W`, TotalTime (launch to first frame), 3 runs. Frames: `dumpsys gfxinfo` over the scripted
# Home scroll in scripts/jank.sh (4 swipes down, 3 sideways through a row, 4 up). These are from 0.1.0
# and 0.2.0, the first two builds; later versions were not measured again.

[facts.startup_ms_min]
value = 275
unit = "ms"
what = "cold start to first frame on the phone, fastest of 3 runs, version 0.2.0"
source = "am start -W (TotalTime) on the Galaxy A54, release build 0.2.0"
date = 2026-11-25

[facts.startup_ms_max]
value = 340
unit = "ms"
what = "cold start to first frame on the phone, slowest of 3 runs, version 0.2.0"
source = "am start -W (TotalTime) on the Galaxy A54, release build 0.2.0"
date = 2026-11-25

[facts.startup_ms_before]
value = 346
unit = "ms"
what = "cold start to first frame on the phone with 0.1.0, before the Baseline Profile"
source = "am start -W (TotalTime) on the Galaxy A54, release build 0.1.0"
date = 2026-11-25

[facts.janky_pct]
value = 1.31
unit = "%"
what = "share of frames Android marks as janky during the scripted Home scroll, version 0.2.0"
source = "dumpsys gfxinfo after scripts/jank.sh on the Galaxy A54, release build 0.2.0"
date = 2026-11-25

[facts.janky_pct_before]
value = 2.63
unit = "%"
what = "the same with 0.1.0"
source = "dumpsys gfxinfo after scripts/jank.sh on the Galaxy A54, release build 0.1.0"
