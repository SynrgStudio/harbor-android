# Harbor for Android's corpus: what is true about it and can be published. The format is synrgs-web's CORPUS.md.
# Numbers come from the released source, the published release, or real runs on a phone; each says which.
# How the phone numbers were taken is in notes/performance.md.

[project]
name = "Harbor for Android"
short_name = "Harbor"
version = "0.8.0"
released = 2026-11-27
license = "GPL-3.0-or-later"
platforms = ["Android 10 or later"]
abis = ["arm64-v8a (phones)", "x86_64 (emulators and Chromebooks)"]
language = "Kotlin + Jetpack Compose; the torrent engine is Rust (librqbit) behind a thin JNI layer"
repo = "https://github.com/SynrgStudio/harbor-android"
download = "https://github.com/SynrgStudio/harbor-android/releases/latest"
releases = "https://github.com/SynrgStudio/harbor-android/releases"
site = "https://harbor.synrgs.tech"
inspired_by = "https://github.com/HarborCommunity/Harbor"
status = "in active development; signed APKs on GitHub Releases, not on any app store"
signing_cert_sha256 = "E2:FA:56:B9:3D:A9:A7:ED:2D:09:D3:23:58:A6:18:16:2F:97:55:99:18:E3:C6:F5:24:00:72:B4:AF:54:B0:B8"

# The phone the performance numbers below were measured on.
[phone]
model = "Samsung Galaxy A54"
os = "Android 16"
display = "120 Hz"

# The app's own look, for pages that want to match it.
[brand]
accent = "#7DD3FC"
accent_deep = "#38BDF8"
background = "#07080B"
surface = "#111318"
text = "#F4F6FA"
text_dim = "#A6AEBB"
font = "Inter"
icon = "icon.svg"

